<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 390" role="img" font-family="Inter, Arial, sans-serif"><title>Maximum runtime supporting view</title><desc>The same maximum runtime values in a narrow layout with full-size labels. A 8,10,11 seconds and B 6,7,9 seconds across baseline, mild and strong noise; all below the 12-second budget.</desc><rect x="0" y="0" width="440" height="390" fill="white"/><text x="20" y="33" font-size="24" fill="#17233c" text-anchor="start" font-weight="700">Maximum observed runtime</text><text x="20" y="61" font-size="19" fill="#667085" text-anchor="start" font-weight="400">Maximum of 8 recorded runs</text><line x1="155" y1="105" x2="155" y2="328" stroke="#d8dbe4" stroke-width="1"/><text x="155" y="353" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">0</text><line x1="228.429" y1="105" x2="228.429" y2="328" stroke="#d8dbe4" stroke-width="1"/><text x="228.429" y="353" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">4</text><line x1="301.857" y1="105" x2="301.857" y2="328" stroke="#d8dbe4" stroke-width="1"/><text x="301.857" y="353" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">8</text><line x1="375.286" y1="105" x2="375.286" y2="328" stroke="#d8dbe4" stroke-width="1"/><text x="375.286" y="353" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">12</text><line x1="375.286" y1="103" x2="375.286" y2="328" stroke="#c9455a" stroke-width="2" stroke-dasharray="6 4"/><text x="375.286" y="90" font-size="20" fill="#c9455a" text-anchor="middle" font-weight="650">12 s</text><text x="20" y="131" font-size="20" fill="#17233c" text-anchor="start" font-weight="650">Baseline</text><circle cx="301.857" cy="125" r="7" fill="#3157a4" stroke="white" stroke-width="1.5"/><text x="301.857" y="111" font-size="20" fill="#3157a4" text-anchor="middle" font-weight="650">A 8</text><circle cx="265.143" cy="125" r="7" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="265.143" y="153" font-size="20" fill="#7656a6" text-anchor="middle" font-weight="650">B 6</text><text x="20" y="218" font-size="20" fill="#17233c" text-anchor="start" font-weight="650">Mild noise</text><circle cx="338.571" cy="212" r="7" fill="#3157a4" stroke="white" stroke-width="1.5"/><text x="338.571" y="198" font-size="20" fill="#3157a4" text-anchor="middle" font-weight="650">A 10</text><circle cx="283.5" cy="212" r="7" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="283.5" y="240" font-size="20" fill="#7656a6" text-anchor="middle" font-weight="650">B 7</text><text x="20" y="305" font-size="20" fill="#17233c" text-anchor="start" font-weight="650">Strong noise</text><circle cx="356.929" cy="299" r="7" fill="#3157a4" stroke="white" stroke-width="1.5"/><text x="348.929" y="285" font-size="20" fill="#3157a4" text-anchor="middle" font-weight="650">A 11</text><circle cx="320.214" cy="299" r="7" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="320.214" y="327" font-size="20" fill="#7656a6" text-anchor="middle" font-weight="650">B 9</text><text x="283.5" y="383" font-size="21" fill="#667085" text-anchor="middle" font-weight="400">Seconds</text></svg>
