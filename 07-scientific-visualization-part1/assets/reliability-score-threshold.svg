<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" font-family="Inter, Arial, sans-serif"><title>Run scores and the failure boundary</title><desc>The original sixteen baseline scores, each represented by one dot. Scores below 70 are failures: A none, B scores 58 and 66. Vertical offsets prevent overlapping dots and do not encode data.</desc><rect x="0" y="0" width="680" height="390" fill="white"/><text x="24" y="35" font-size="25" fill="#17233c" text-anchor="start" font-weight="700">Baseline · individual run scores</text><text x="24" y="65" font-size="20" fill="#667085" text-anchor="start" font-weight="400">Each dot is one run · 8 runs per method</text><rect x="155" y="108" width="196" height="179" fill="#f9edf0"/><line x1="351" y1="98" x2="351" y2="287" stroke="#c9455a" stroke-width="2" stroke-dasharray="7 5"/><text x="342" y="94" font-size="20" fill="#c9455a" text-anchor="end" font-weight="650">Fail &lt;70</text><line x1="155" y1="108" x2="155" y2="287" stroke="#d8dbe4" stroke-width="1"/><text x="155" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">50</text><line x1="253" y1="108" x2="253" y2="287" stroke="#d8dbe4" stroke-width="1"/><text x="253" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">60</text><line x1="351" y1="108" x2="351" y2="287" stroke="#d8dbe4" stroke-width="1"/><text x="351" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">70</text><line x1="449" y1="108" x2="449" y2="287" stroke="#d8dbe4" stroke-width="1"/><text x="449" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">80</text><line x1="547" y1="108" x2="547" y2="287" stroke="#d8dbe4" stroke-width="1"/><text x="547" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">90</text><line x1="645" y1="108" x2="645" y2="287" stroke="#d8dbe4" stroke-width="1"/><text x="645" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">100</text><text x="24" y="164" font-size="22" fill="#3157a4" text-anchor="start" font-weight="650">Method A</text><circle cx="419.6" cy="157" r="8" fill="#3157a4" stroke="white" stroke-width="1.5"/><circle cx="429.4" cy="139" r="8" fill="#3157a4" stroke="white" stroke-width="1.5"/><circle cx="439.2" cy="157" r="8" fill="#3157a4" stroke="white" stroke-width="1.5"/><circle cx="449" cy="139" r="8" fill="#3157a4" stroke="white" stroke-width="1.5"/><circle cx="449" cy="175" r="8" fill="#3157a4" stroke="white" stroke-width="1.5"/><circle cx="458.8" cy="157" r="8" fill="#3157a4" stroke="white" stroke-width="1.5"/><circle cx="468.6" cy="139" r="8" fill="#3157a4" stroke="white" stroke-width="1.5"/><circle cx="478.4" cy="157" r="8" fill="#3157a4" stroke="white" stroke-width="1.5"/><text x="24" y="251" font-size="22" fill="#7656a6" text-anchor="start" font-weight="650">Method B</text><circle cx="233.4" cy="244" r="8" fill="#7656a6" stroke="white" stroke-width="1.5"/><circle cx="311.8" cy="244" r="8" fill="#7656a6" stroke="white" stroke-width="1.5"/><circle cx="390.2" cy="244" r="8" fill="#7656a6" stroke="white" stroke-width="1.5"/><circle cx="429.4" cy="244" r="8" fill="#7656a6" stroke="white" stroke-width="1.5"/><circle cx="468.6" cy="244" r="8" fill="#7656a6" stroke="white" stroke-width="1.5"/><circle cx="507.8" cy="244" r="8" fill="#7656a6" stroke="white" stroke-width="1.5"/><circle cx="605.8" cy="244" r="8" fill="#7656a6" stroke="white" stroke-width="1.5"/><circle cx="645" cy="244" r="8" fill="#7656a6" stroke="white" stroke-width="1.5"/><line x1="155" y1="287" x2="645" y2="287" stroke="#667085" stroke-width="1.5"/><text x="400" y="356" font-size="21" fill="#667085" text-anchor="middle" font-weight="400">Score · detail range 50–100</text></svg>
