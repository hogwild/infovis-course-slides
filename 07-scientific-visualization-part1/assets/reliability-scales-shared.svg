<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" font-family="Inter, Arial, sans-serif"><title>Failure counts on shared scales</title><desc>Baseline A zero and B two failures; strong noise A four and B two. Eight runs in all groups. Both axes are zero to eight, so the equal B counts have equal heights.</desc><rect x="0" y="0" width="680" height="390" fill="white"/><text x="24" y="35" font-size="25" fill="#17233c" text-anchor="start" font-weight="700">Shared count scale</text><text x="24" y="65" font-size="20" fill="#667085" text-anchor="start" font-weight="400">Same data · failure: score &lt;70 · 8 runs each</text><text x="187" y="100" font-size="23" fill="#17233c" text-anchor="middle" font-weight="650">Baseline</text><line x1="60" y1="294" x2="298" y2="294" stroke="#d8dbe4" stroke-width="1"/><text x="48" y="300" font-size="20" fill="#667085" text-anchor="end" font-weight="400">0</text><line x1="60" y1="254" x2="298" y2="254" stroke="#d8dbe4" stroke-width="1"/><text x="48" y="260" font-size="20" fill="#667085" text-anchor="end" font-weight="400">2</text><line x1="60" y1="214" x2="298" y2="214" stroke="#d8dbe4" stroke-width="1"/><text x="48" y="220" font-size="20" fill="#667085" text-anchor="end" font-weight="400">4</text><line x1="60" y1="174" x2="298" y2="174" stroke="#d8dbe4" stroke-width="1"/><text x="48" y="180" font-size="20" fill="#667085" text-anchor="end" font-weight="400">6</text><line x1="60" y1="134" x2="298" y2="134" stroke="#d8dbe4" stroke-width="1"/><text x="48" y="140" font-size="20" fill="#667085" text-anchor="end" font-weight="400">8</text><line x1="105" y1="294" x2="165" y2="294" stroke="#3157a4" stroke-width="3"/><text x="135" y="282" font-size="26" fill="#3157a4" text-anchor="middle" font-weight="700">0</text><text x="135" y="327" font-size="22" fill="#3157a4" text-anchor="middle" font-weight="650">A</text><rect x="210" y="254" width="60" height="40" fill="#7656a6"/><text x="240" y="242" font-size="26" fill="#7656a6" text-anchor="middle" font-weight="700">2</text><text x="240" y="327" font-size="22" fill="#7656a6" text-anchor="middle" font-weight="650">B</text><text x="522" y="100" font-size="23" fill="#17233c" text-anchor="middle" font-weight="650">Strong noise</text><line x1="395" y1="294" x2="633" y2="294" stroke="#d8dbe4" stroke-width="1"/><text x="383" y="300" font-size="20" fill="#667085" text-anchor="end" font-weight="400">0</text><line x1="395" y1="254" x2="633" y2="254" stroke="#d8dbe4" stroke-width="1"/><text x="383" y="260" font-size="20" fill="#667085" text-anchor="end" font-weight="400">2</text><line x1="395" y1="214" x2="633" y2="214" stroke="#d8dbe4" stroke-width="1"/><text x="383" y="220" font-size="20" fill="#667085" text-anchor="end" font-weight="400">4</text><line x1="395" y1="174" x2="633" y2="174" stroke="#d8dbe4" stroke-width="1"/><text x="383" y="180" font-size="20" fill="#667085" text-anchor="end" font-weight="400">6</text><line x1="395" y1="134" x2="633" y2="134" stroke="#d8dbe4" stroke-width="1"/><text x="383" y="140" font-size="20" fill="#667085" text-anchor="end" font-weight="400">8</text><rect x="440" y="214" width="60" height="80" fill="#3157a4"/><text x="470" y="202" font-size="26" fill="#3157a4" text-anchor="middle" font-weight="700">4</text><text x="470" y="327" font-size="22" fill="#3157a4" text-anchor="middle" font-weight="650">A</text><rect x="545" y="254" width="60" height="40" fill="#7656a6"/><text x="575" y="242" font-size="26" fill="#7656a6" text-anchor="middle" font-weight="700">2</text><text x="575" y="327" font-size="22" fill="#7656a6" text-anchor="middle" font-weight="650">B</text><text x="340" y="372" font-size="21" fill="#667085" text-anchor="middle" font-weight="400">B = 2 in both conditions; compare the axes.</text></svg>
