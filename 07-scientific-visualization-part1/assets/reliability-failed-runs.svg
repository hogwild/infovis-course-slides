<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" role="img" font-family="Inter, Arial, sans-serif"><title>Compare failed runs: A 0 of 8, B 2 of 8</title><desc>The same constructed eight runs per method. Failure is defined in advance as score below 70. A has zero failures; B has two failures (scores 58 and 66). These are observed counts, not estimated guarantees for future runs.</desc><rect width="520" height="350" fill="white"/><text x="24" y="35" font-size="25" fill="#17233c" text-anchor="start" font-weight="700">2 · Fewer failures</text><text x="24" y="65" font-size="19" fill="#667085" text-anchor="start" font-weight="400">Same 8 baseline runs per method.</text><line x1="74" y1="272" x2="487" y2="272" stroke="#d8dbe4" stroke-width="1"/><text x="60" y="278" font-size="18" fill="#667085" text-anchor="end" font-weight="400">0</text><line x1="74" y1="230" x2="487" y2="230" stroke="#d8dbe4" stroke-width="1"/><text x="60" y="236" font-size="18" fill="#667085" text-anchor="end" font-weight="400">2</text><line x1="74" y1="188" x2="487" y2="188" stroke="#d8dbe4" stroke-width="1"/><text x="60" y="194" font-size="18" fill="#667085" text-anchor="end" font-weight="400">4</text><line x1="74" y1="146" x2="487" y2="146" stroke="#d8dbe4" stroke-width="1"/><text x="60" y="152" font-size="18" fill="#667085" text-anchor="end" font-weight="400">6</text><line x1="74" y1="104" x2="487" y2="104" stroke="#d8dbe4" stroke-width="1"/><text x="60" y="110" font-size="18" fill="#667085" text-anchor="end" font-weight="400">8</text><line x1="152" y1="272" x2="240" y2="272" stroke="#3157a4" stroke-width="3"/><text x="196" y="260" font-size="27" fill="#3157a4" text-anchor="middle" font-weight="750">0 / 8</text><text x="196" y="307" font-size="22" fill="#17233c" text-anchor="middle" font-weight="650">Method A</text><rect x="352" y="230" width="88" height="42" rx="3" fill="#7656a6"/><text x="396" y="218" font-size="27" fill="#7656a6" text-anchor="middle" font-weight="750">2 / 8</text><text x="396" y="307" font-size="22" fill="#17233c" text-anchor="middle" font-weight="650">Method B</text><line x1="74" y1="272" x2="487" y2="272" stroke="#667085" stroke-width="1.5"/><text x="280" y="337" font-size="19" fill="#667085" text-anchor="middle" font-weight="400">Failure: score &lt; 70</text></svg>
