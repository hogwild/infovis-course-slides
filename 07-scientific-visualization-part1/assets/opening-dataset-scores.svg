<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" role="img" font-family="Inter, Arial, sans-serif"><title>Paired A and B scores for six datasets</title><desc>Constructed teaching data. A/B scores: D1 88/70, D2 84/76, D3 80/86, D4 78/62, D5 92/86, D6 82/88. A is higher on four datasets; B is higher on D3 and D6. Their equal-weight means are A 84 and B 78.</desc><rect width="520" height="350" fill="white"/><text x="24" y="35" font-size="25" fill="#17233c" text-anchor="start" font-weight="700">Each dataset</text><circle cx="270" cy="28" r="6" fill="#3157a4"/><text x="282" y="34" font-size="17" fill="#3157a4" text-anchor="start" font-weight="650">Method A</text><circle cx="400" cy="28" r="6" fill="#7656a6"/><text x="412" y="34" font-size="17" fill="#7656a6" text-anchor="start" font-weight="650">Method B</text><text x="24" y="64" font-size="18" fill="#667085" text-anchor="start" font-weight="400">Score · higher is better</text><line x1="82" y1="84" x2="82" y2="289" stroke="#d8dbe4" stroke-width="1"/><text x="82" y="320" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">0</text><line x1="163.6" y1="84" x2="163.6" y2="289" stroke="#d8dbe4" stroke-width="1"/><text x="163.6" y="320" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">20</text><line x1="245.2" y1="84" x2="245.2" y2="289" stroke="#d8dbe4" stroke-width="1"/><text x="245.2" y="320" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">40</text><line x1="326.8" y1="84" x2="326.8" y2="289" stroke="#d8dbe4" stroke-width="1"/><text x="326.8" y="320" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">60</text><line x1="408.4" y1="84" x2="408.4" y2="289" stroke="#d8dbe4" stroke-width="1"/><text x="408.4" y="320" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">80</text><line x1="490" y1="84" x2="490" y2="289" stroke="#d8dbe4" stroke-width="1"/><text x="490" y="320" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">100</text><text x="24" y="100" font-size="20" fill="#17233c" text-anchor="start" font-weight="650">D1</text><line x1="441.04" y1="94" x2="367.6" y2="94" stroke="#aeb6c3" stroke-width="3"/><circle cx="441.04" cy="94" r="7" fill="#3157a4" stroke="white" stroke-width="1.5"/><circle cx="367.6" cy="94" r="7" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="24" y="136" font-size="20" fill="#17233c" text-anchor="start" font-weight="650">D2</text><line x1="424.72" y1="130" x2="392.08" y2="130" stroke="#aeb6c3" stroke-width="3"/><circle cx="424.72" cy="130" r="7" fill="#3157a4" stroke="white" stroke-width="1.5"/><circle cx="392.08" cy="130" r="7" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="24" y="172" font-size="20" fill="#17233c" text-anchor="start" font-weight="650">D3</text><line x1="408.4" y1="166" x2="432.88" y2="166" stroke="#aeb6c3" stroke-width="3"/><circle cx="408.4" cy="166" r="7" fill="#3157a4" stroke="white" stroke-width="1.5"/><circle cx="432.88" cy="166" r="7" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="111" y="172" font-size="18" fill="#7656a6" text-anchor="start" font-weight="650">B higher</text><text x="24" y="208" font-size="20" fill="#17233c" text-anchor="start" font-weight="650">D4</text><line x1="400.24" y1="202" x2="334.96" y2="202" stroke="#aeb6c3" stroke-width="3"/><circle cx="400.24" cy="202" r="7" fill="#3157a4" stroke="white" stroke-width="1.5"/><circle cx="334.96" cy="202" r="7" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="24" y="244" font-size="20" fill="#17233c" text-anchor="start" font-weight="650">D5</text><line x1="457.36" y1="238" x2="432.88" y2="238" stroke="#aeb6c3" stroke-width="3"/><circle cx="457.36" cy="238" r="7" fill="#3157a4" stroke="white" stroke-width="1.5"/><circle cx="432.88" cy="238" r="7" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="24" y="280" font-size="20" fill="#17233c" text-anchor="start" font-weight="650">D6</text><line x1="416.56" y1="27