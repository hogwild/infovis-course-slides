<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" role="img" font-family="Inter, Arial, sans-serif"><title>Baseline individual scores reveal outcome variability</title><desc>Same constructed baseline data, eight runs per method. Both observed mean scores are 80. A scores range from 77 to 83; B scores range from 58 to 100. The horizontal score axis uses the same labeled 50-to-100 detail range in both views. Each dot is an individual run. Vertical offsets separate points and do not encode values.</desc><rect width="520" height="350" fill="white" /><text x="24" y="35" font-size="25" fill="#17233c" text-anchor="start" font-weight="700">Baseline · individual scores</text><text x="24" y="65" font-size="19" fill="#667085" text-anchor="start" font-weight="400">8 runs per method · Each dot is one run</text><line x1="135" y1="104" x2="135" y2="264" stroke="#d8dbe4" stroke-width="1" /><text x="135" y="291" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">50</text><line x1="205" y1="104" x2="205" y2="264" stroke="#d8dbe4" stroke-width="1" /><text x="205" y="291" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">60</text><line x1="275" y1="104" x2="275" y2="264" stroke="#d8dbe4" stroke-width="1" /><text x="275" y="291" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">70</text><line x1="345" y1="104" x2="345" y2="264" stroke="#d8dbe4" stroke-width="1" /><text x="345" y="291" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">80</text><line x1="415" y1="104" x2="415" y2="264" stroke="#d8dbe4" stroke-width="1" /><text x="415" y="291" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">90</text><line x1="485" y1="104" x2="485" y2="264" stroke="#d8dbe4" stroke-width="1" /><text x="485" y="291" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">100</text><text x="24" y="152" font-size="20" fill="#3157a4" text-anchor="start" font-weight="650">Method A</text><circle cx="324" cy="145" r="6.5" fill="#3157a4" stroke="white" stroke-width="1" /><circle cx="331" cy="131" r="6.5" fill="#3157a4" stroke="white" stroke-width="1" /><circle cx="338" cy="145" r="6.5" fill="#3157a4" stroke="white" stroke-width="1" /><circle cx="345" cy="131" r="6.5" fill="#3157a4" stroke="white" stroke-width="1" /><circle cx="345" cy="159" r="6.5" fill="#3157a4" stroke="white" stroke-width="1" /><circle cx="352" cy="145" r="6.5" fill="#3157a4" stroke="white" stroke-width="1" /><circle cx="359" cy="131" r="6.5" fill="#3157a4" stroke="white" stroke-width="1" /><circle cx="366" cy="145" r="6.5" fill="#3157a4" stroke="white" stroke-width="1" /><text x="24" y="228" font-size="20" fill="#7656a6" text-anchor="start" font-weight="650">Method B</text><circle cx="191" cy="221" r="6.5" fill="#7656a6" stroke="white" stroke-width="1" /><circle cx="247" cy="221" r="6.5" fill="#7656a6" stroke="white" stroke-width="1" /><circle cx="303" cy="221" r="6.5" fill="#7656a6" stroke="white" stroke-width="1" /><circle cx="331" cy="221" r="6.5" fill="#7656a6" stroke="white" stroke-width="1" /><circle cx="359" cy="221" r="6.5" fill="#7656a6" stroke="white" stroke-width="1" /><circle cx="387" cy="221" r="6.5" fill="#7656a6" stroke="white" stroke-width="1" /><circle cx="457" cy="221" r="6.5" fill="#7656a6" stroke="white" stroke-width="1" /><circle cx="485" cy="221" r="6.5" fill="#7656a6" stroke="white" stroke-width="1" /><line x1="135" y1="264" x2="485" y2="264" stroke="#667085" stroke-width="1.5" /><text x="310" y="326" font-size="19" fill="#667085" text-anchor="middle" font-weight="400">Score · 50–100 detail range</text></svg>
