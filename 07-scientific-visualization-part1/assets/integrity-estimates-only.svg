<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" font-family="Inter, Arial, sans-serif"><title>Baseline failure estimates without uncertainty intervals</title><desc>Before-design example using the same constructed baseline data and axes as the Wilson-interval figure. A 0/8 at 0 percent; B 2/8 at 25 percent. Only the point estimates are shown, so estimate precision is not visible.</desc><rect x="0" y="0" width="680" height="390" fill="white" /><text x="24" y="35" font-size="25" fill="#17233c" text-anchor="start" font-weight="700">Baseline · estimated failure probability</text><text x="24" y="65" font-size="20" fill="#667085" text-anchor="start" font-weight="400">Observed fraction only</text><line x1="155" y1="115" x2="155" y2="285" stroke="#d8dbe4" stroke-width="1" /><text x="155" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">0%</text><line x1="275" y1="115" x2="275" y2="285" stroke="#d8dbe4" stroke-width="1" /><text x="275" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">25%</text><line x1="395" y1="115" x2="395" y2="285" stroke="#d8dbe4" stroke-width="1" /><text x="395" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">50%</text><line x1="515" y1="115" x2="515" y2="285" stroke="#d8dbe4" stroke-width="1" /><text x="515" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">75%</text><line x1="635" y1="115" x2="635" y2="285" stroke="#d8dbe4" stroke-width="1" /><text x="635" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">100%</text><text x="24" y="167" font-size="22" fill="#3157a4" text-anchor="start" font-weight="650">Method A</text><circle cx="155" cy="160" r="9" fill="#3157a4" stroke="white" stroke-width="1.5" /><text x="167.0" y="136" font-size="22" fill="#3157a4" text-anchor="start" font-weight="650">0 / 8</text><text x="24" y="252" font-size="22" fill="#7656a6" text-anchor="start" font-weight="650">Method B</text><circle cx="275" cy="245" r="9" fill="#7656a6" stroke="white" stroke-width="1.5" /><text x="287.0" y="221" font-size="22" fill="#7656a6" text-anchor="start" font-weight="650">2 / 8</text><text x="395" y="363" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">Failure: score &lt;70 · n = 8 per method</text></svg>
