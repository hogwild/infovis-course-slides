<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" font-family="Inter, Arial, sans-serif"><title>Baseline failure fractions preserve the required comparison</title><desc>Same eight constructed baseline runs per method as the mean-score chart. Failure means score below 70. A zero of eight, zero percent; B two of eight, 25 percent. Percentages use a zero-to-100 axis.</desc><rect width="680" height="390" fill="white"/><text x="24" y="35" font-size="25" fill="#17233c" text-anchor="start" font-weight="700">Baseline · failure fraction</text><text x="24" y="65" font-size="20" fill="#667085" text-anchor="start" font-weight="400">Failure: score &lt;70 · 8 runs per method</text><line x1="86" y1="300" x2="638" y2="300" stroke="#d8dbe4" stroke-width="1"/><text x="71" y="306" font-size="20" fill="#667085" text-anchor="end" font-weight="400">0%</text><line x1="86" y1="262" x2="638" y2="262" stroke="#d8dbe4" stroke-width="1"/><text x="71" y="268" font-size="20" fill="#667085" text-anchor="end" font-weight="400">20%</text><line x1="86" y1="224" x2="638" y2="224" stroke="#d8dbe4" stroke-width="1"/><text x="71" y="230" font-size="20" fill="#667085" text-anchor="end" font-weight="400">40%</text><line x1="86" y1="186" x2="638" y2="186" stroke="#d8dbe4" stroke-width="1"/><text x="71" y="192" font-size="20" fill="#667085" text-anchor="end" font-weight="400">60%</text><line x1="86" y1="148" x2="638" y2="148" stroke="#d8dbe4" stroke-width="1"/><text x="71" y="154" font-size="20" fill="#667085" text-anchor="end" font-weight="400">80%</text><line x1="86" y1="110" x2="638" y2="110" stroke="#d8dbe4" stroke-width="1"/><text x="71" y="116" font-size="20" fill="#667085" text-anchor="end" font-weight="400">100%</text><line x1="146" y1="300" x2="254" y2="300" stroke="#3157a4" stroke-width="3"/><text x="200" y="285" font-size="26" fill="#3157a4" text-anchor="middle" font-weight="700">0% (0/8)</text><text x="200" y="338" font-size="24" fill="#17233c" text-anchor="middle" font-weight="650">Method A</text><rect x="408" y="252.5" width="108" height="47.5" fill="#7656a6"/><text x="462" y="237.5" font-size="26" fill="#7656a6" text-anchor="middle" font-weight="700">25% (2/8)</text><text x="462" y="338" font-size="24" fill="#17233c" text-anchor="middle" font-weight="650">Method B</text><text x="362" y="374" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">Failed runs / total runs</text></svg>
