<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" font-family="Inter, Arial, sans-serif"><title>Uncertainty remains after observing zero failures</title><desc>Ninety-five percent Wilson intervals under independent binomial runs. A zero of eight, interval 0 to 32.4 percent. B two of eight, interval 7.1 to 59.1 percent. These are marginal intervals and not a test of the difference between methods.</desc><rect x="0" y="0" width="680" height="390" fill="white"/><text x="24" y="35" font-size="25" fill="#17233c" text-anchor="start" font-weight="700">Baseline · estimated failure probability</text><text x="24" y="65" font-size="20" fill="#667085" text-anchor="start" font-weight="400">Observed fraction + 95% Wilson interval</text><line x1="155" y1="115" x2="155" y2="285" stroke="#d8dbe4" stroke-width="1"/><text x="155" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">0%</text><line x1="275" y1="115" x2="275" y2="285" stroke="#d8dbe4" stroke-width="1"/><text x="275" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">25%</text><line x1="395" y1="115" x2="395" y2="285" stroke="#d8dbe4" stroke-width="1"/><text x="395" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">50%</text><line x1="515" y1="115" x2="515" y2="285" stroke="#d8dbe4" stroke-width="1"/><text x="515" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">75%</text><line x1="635" y1="115" x2="635" y2="285" stroke="#d8dbe4" stroke-width="1"/><text x="635" y="319" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">100%</text><text x="24" y="167" font-size="22" fill="#3157a4" text-anchor="start" font-weight="650">Method A</text><line x1="155" y1="160" x2="310.716" y2="160" stroke="#3157a4" stroke-width="4"/><line x1="155" y1="149" x2="155" y2="171" stroke="#3157a4" stroke-width="2"/><line x1="310.716" y1="149" x2="310.716" y2="171" stroke="#3157a4" stroke-width="2"/><circle cx="155" cy="160" r="9" fill="#3157a4" stroke="white" stroke-width="1.5"/><text x="159" y="136" font-size="22" fill="#3157a4" text-anchor="start" font-weight="650">0/8 · interval 0.0–32.4%</text><text x="24" y="252" font-size="22" fill="#7656a6" text-anchor="start" font-weight="650">Method B</text><line x1="189.31" y1="245" x2="438.548" y2="245" stroke="#7656a6" stroke-width="4"/><line x1="189.31" y1="234" x2="189.31" y2="256" stroke="#7656a6" stroke-width="2"/><line x1="438.548" y1="234" x2="438.548" y2="256" stroke="#7656a6" stroke-width="2"/><circle cx="275" cy="245" r="9" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="193.31" y="221" font-size="22" fill="#7656a6" text-anchor="start" font-weight="650">2/8 · interval 7.1–59.1%</text><text x="395" y="363" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">Failure: score &lt;70 · n = 8 per method</text></svg>
