<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" role="img" font-family="Inter, Arial, sans-serif"><title>Baseline mean scores alone do not show outcome variability</title><desc>Same constructed baseline data, eight runs per method. Both observed mean scores are 80. A scores range from 77 to 83; B scores range from 58 to 100. The horizontal score axis uses the same labeled 50-to-100 detail range in both views. Each point is one method's mean, not one run. Individual scores are not shown.</desc><rect width="520" height="350" fill="white" /><text x="24" y="35" font-size="25" fill="#17233c" text-anchor="start" font-weight="700">Baseline · mean score</text><text x="24" y="65" font-size="19" fill="#667085" text-anchor="start" font-weight="400">8 runs per method · Each point is a mean</text><line x1="135" y1="104" x2="135" y2="264" stroke="#d8dbe4" stroke-width="1" /><text x="135" y="291" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">50</text><line x1="205" y1="104" x2="205" y2="264" stroke="#d8dbe4" stroke-width="1" /><text x="205" y="291" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">60</text><line x1="275" y1="104" x2="275" y2="264" stroke="#d8dbe4" stroke-width="1" /><text x="275" y="291" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">70</text><line x1="345" y1="104" x2="345" y2="264" stroke="#d8dbe4" stroke-width="1" /><text x="345" y="291" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">80</text><line x1="415" y1="104" x2="415" y2="264" stroke="#d8dbe4" stroke-width="1" /><text x="415" y="291" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">90</text><line x1="485" y1="104" x2="485" y2="264" stroke="#d8dbe4" stroke-width="1" /><text x="485" y="291" font-size="18" fill="#667085" text-anchor="middle" font-weight="400">100</text><text x="24" y="152" font-size="20" fill="#3157a4" text-anchor="start" font-weight="650">Method A</text><text x="24" y="228" font-size="20" fill="#7656a6" text-anchor="start" font-weight="650">Method B</text><line x1="135" y1="264" x2="485" y2="264" stroke="#667085" stroke-width="1.5" /><text x="310" y="326" font-size="19" fill="#667085" text-anchor="middle" font-weight="400">Score · 50–100 detail range</text><circle cx="345" cy="145" r="8" fill="#3157a4" stroke="white" stroke-width="1.5" /><text x="345" y="126" font-size="23" fill="#3157a4" text-anchor="middle" font-weight="700">80</text><circle cx="345" cy="221" r="8" fill="#7656a6" stroke="white" stroke-width="1.5" /><text x="345" y="202" font-size="23" fill="#7656a6" text-anchor="middle" font-weight="700">80</text></svg>
