<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" font-family="Inter, Arial, sans-serif"><title>The failure definition affects the apparent conclusion</title><desc>Baseline data held fixed. Score below 70: A 0/8, B 2/8. Below 80: A 3/8, B 4/8. Below 85: A 8/8, B 5/8. Alternative cutoffs are a teaching sensitivity check, not post hoc replacements for the original rule.</desc><rect x="0" y="0" width="680" height="390" fill="white"/><text x="24" y="35" font-size="25" fill="#17233c" text-anchor="start" font-weight="700">The same baseline scores, three failure rules</text><text x="24" y="65" font-size="20" fill="#667085" text-anchor="start" font-weight="400">Original failure rule: score &lt;70</text><text x="36" y="113" font-size="23" fill="#17233c" text-anchor="start" font-weight="700">Failure rule</text><text x="268" y="113" font-size="23" fill="#17233c" text-anchor="start" font-weight="700">Method A</text><text x="441" y="113" font-size="23" fill="#17233c" text-anchor="start" font-weight="700">Method B</text><rect x="24" y="138" width="632" height="63" fill="#edf2fa"/><text x="36" y="178" font-size="24" fill="#17233c" text-anchor="start" font-weight="600">Score &lt;70</text><text x="268" y="178" font-size="28" fill="#3157a4" text-anchor="start" font-weight="700">0 / 8</text><text x="441" y="178" font-size="28" fill="#7656a6" text-anchor="start" font-weight="700">2 / 8</text><rect x="24" y="212" width="632" height="63" fill="#f7f7f8"/><text x="36" y="252" font-size="24" fill="#17233c" text-anchor="start" font-weight="600">Score &lt;80</text><text x="268" y="252" font-size="28" fill="#3157a4" text-anchor="start" font-weight="700">3 / 8</text><text x="441" y="252" font-size="28" fill="#7656a6" text-anchor="start" font-weight="700">4 / 8</text><rect x="24" y="286" width="632" height="63" fill="#f7f7f8"/><text x="36" y="326" font-size="24" fill="#17233c" text-anchor="start" font-weight="600">Score &lt;85</text><text x="268" y="326" font-size="28" fill="#3157a4" text-anchor="start" font-weight="700">8 / 8</text><text x="441" y="326" font-size="28" fill="#7656a6" text-anchor="start" font-weight="700">5 / 8</text><text x="340" y="374" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">The preferred method can change with the definition.</text></svg>
