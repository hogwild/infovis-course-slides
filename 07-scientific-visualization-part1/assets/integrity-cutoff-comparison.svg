<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" role="img" font-family="Inter, Arial, sans-serif"><title>Failure fractions under three explicit score cutoffs</title><desc>Same constructed baseline scores, eight runs per method. Horizontal position encodes failure fraction on a common zero-to-100-percent axis. The primary rule is score below 70: A 0/8, B 2/8. Alternatives are score below 80: A 3/8, B 4/8; and score below 85: A 8/8, B 5/8. The method ordering reverses at the third rule. Each horizontal segment compares two aggregate fractions; it does not pair individual runs or interpolate between cutoffs.</desc><rect width="740" height="470" fill="white"/><text x="24" y="35" font-size="26" fill="#17233c" text-anchor="start" font-weight="700">Same scores, different failure rules</text><text x="24" y="66" font-size="21" fill="#667085" text-anchor="start" font-weight="400">Same 8 baseline runs per method</text><rect x="16" y="106" width="708" height="82" rx="3" fill="#edf2fa"/><line x1="235" y1="109" x2="235" y2="395" stroke="#d8dbe4" stroke-width="1"/><text x="235" y="424" font-size="21" fill="#667085" text-anchor="middle" font-weight="400">0%</text><line x1="348.75" y1="109" x2="348.75" y2="395" stroke="#d8dbe4" stroke-width="1"/><text x="348.75" y="424" font-size="21" fill="#667085" text-anchor="middle" font-weight="400">25%</text><line x1="462.5" y1="109" x2="462.5" y2="395" stroke="#d8dbe4" stroke-width="1"/><text x="462.5" y="424" font-size="21" fill="#667085" text-anchor="middle" font-weight="400">50%</text><line x1="576.25" y1="109" x2="576.25" y2="395" stroke="#d8dbe4" stroke-width="1"/><text x="576.25" y="424" font-size="21" fill="#667085" text-anchor="middle" font-weight="400">75%</text><line x1="690" y1="109" x2="690" y2="395" stroke="#d8dbe4" stroke-width="1"/><text x="690" y="424" font-size="21" fill="#667085" text-anchor="middle" font-weight="400">100%</text><text x="26" y="145" font-size="25" fill="#17233c" text-anchor="start" font-weight="650">Score &lt;70</text><text x="26" y="171" font-size="19" fill="#3157a4" text-anchor="start" font-weight="600">Primary rule</text><line x1="235" y1="140" x2="348.75" y2="140" stroke="#d8dbe4" stroke-width="4"/><circle cx="235" cy="140" r="8.5" fill="#3157a4" stroke="white" stroke-width="1.5"/><text x="246" y="122" font-size="23" fill="#3157a4" text-anchor="start" font-weight="650">A 0/8</text><circle cx="348.75" cy="140" r="8.5" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="348.75" y="169" font-size="23" fill="#7656a6" text-anchor="middle" font-weight="650">B 2/8</text><text x="26" y="245" font-size="25" fill="#17233c" text-anchor="start" font-weight="650">Score &lt;80</text><text x="26" y="271" font-size="19" fill="#667085" text-anchor="start" font-weight="400">Alternative</text><line x1="405.625" y1="240" x2="462.5" y2="240" stroke="#d8dbe4" stroke-width="4"/><circle cx="405.625" cy="240" r="8.5" fill="#3157a4" stroke="white" stroke-width="1.5"/><text x="405.625" y="222" font-size="23" fill="#3157a4" text-anchor="middle" font-weight="650">A 3/8</text><circle cx="462.5" cy="240" r="8.5" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="462.5" y="269" font-size="23" fill="#7656a6" text-anchor="middle" font-weight="650">B 4/8</text><text x="26" y="345" font-size="25" fill="#17233c" text-anchor="start" font-weight="650">Score &lt;85</text><text x="26" y="371" font-size="19" fill="#667085" text-anchor="start" font-weight="400">Alternative</text><line x1="690" y1="340" x2="519.375" y2="340" stroke="#d8dbe4" stroke-width="4"/><circle cx="690" cy="340" r="8.5" fill="#3157a4" stroke="white" stroke-width="1.5"/><text x="690" y="322" font-size="23" fill="#3157a4" text-anchor="end" font-weight="650">A 8/8</text><circle cx="519.375" cy="340" r="8.5" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="519.375" y="369" font-size="23" fill="#7656a6" text-anchor="middle" font-weight="650">B 5/8</text><line x1="235" y1="395" x2="690" y2="395" stroke="#667085" stroke-width="1"/><text x="462.5" y="457" font-size="22" fill="#667085" text-anchor="middle" font-weight="400">Failure fraction (%)</text></svg>
