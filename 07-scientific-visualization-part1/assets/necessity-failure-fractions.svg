idth="4"/><circle cx="185" cy="249" r="9" fill="#3157a4" stroke="white" stroke-width="1.5"/><text x="195" y="232" font-size="26" fill="#3157a4" text-anchor="start" font-weight="650">A 0/8</text><circle cx="288.875" cy="249" r="9" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="298.875" y="280" font-size="26" fill="#7656a6" text-anchor="start" font-weight="650">B 3/8</text><rect x="12" y="317" width="476" height="74" fill="#f9edf0"/><line x1="185" y1="317" x2="185" y2="391" stroke="#d8dbe4" stroke-width="1"/><line x1="323.5" y1="317" x2="323.5" y2="391" stroke="#d8dbe4" stroke-width="1"/><line x1="462" y1="317" x2="462" y2="391" stroke="#d8dbe4" stroke-width="1"/><text x="20" y="361" font-size="26" fill="#17233c" text-anchor="start" font-weight="650">Strong noise</text><line x1="323.5" y1="353" x2="254.25" y2="353" stroke="#d8dbe4" stroke-width="4"/><circle cx="323.5" cy="353" r="9" fill="#3157a4" stroke="white" stroke-width="1.5"/><text x="333.5" y="336" font-size="26" fill="#3157a4" text-anchor="start" font-weight="650">A 4/8</text><circle cx="254.25" cy="353" r="9" fill="#7656a6" stroke="white" stroke-width="1.5"/><text x="264.25" y="384" font-size="26" fill="#7656a6" text-anchor="start" font-weight="650">B 2/8</text><text x="323.5" y="452" font-size="24" fill="#667085" text-anchor="middle" font-weight="400">Failure fraction (%)</text></svg>
