<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" font-family="Inter, Arial, sans-serif"><title>Equal means can hide different failure counts</title><desc>Both baseline score means are exactly 80, computed from the canonical eight run scores for each method. Mean bars alone do not show failures or variation.</desc><rect x="0" y="0" width="680" height="390" fill="white"/><text x="24" y="35" font-size="25" fill="#17233c" text-anchor="start" font-weight="700">Baseline · mean score</text><text x="24" y="65" font-size="20" fill="#667085" text-anchor="start" font-weight="400">8 runs per method · Average score</text><line x1="85" y1="295" x2="635" y2="295" stroke="#d8dbe4" stroke-width="1"/><text x="70" y="302" font-size="20" fill="#667085" text-anchor="end" font-weight="400">0</text><line x1="85" y1="258" x2="635" y2="258" stroke="#d8dbe4" stroke-width="1"/><text x="70" y="265" font-size="20" fill="#667085" text-anchor="end" font-weight="400">20</text><line x1="85" y1="221" x2="635" y2="221" stroke="#d8dbe4" stroke-width="1"/><text x="70" y="228" font-size="20" fill="#667085" text-anchor="end" font-weight="400">40</text><line x1="85" y1="184" x2="635" y2="184" stroke="#d8dbe4" stroke-width="1"/><text x="70" y="191" font-size="20" fill="#667085" text-anchor="end" font-weight="400">60</text><line x1="85" y1="147" x2="635" y2="147" stroke="#d8dbe4" stroke-width="1"/><text x="70" y="154" font-size="20" fill="#667085" text-anchor="end" font-weight="400">80</text><line x1="85" y1="110" x2="635" y2="110" stroke="#d8dbe4" stroke-width="1"/><text x="70" y="117" font-size="20" fill="#667085" text-anchor="end" font-weight="400">100</text><rect x="145" y="147" width="110" height="148" fill="#3157a4"/><text x="200" y="132" font-size="28" fill="#3157a4" text-anchor="middle" font-weight="700">80</text><text x="200" y="334" font-size="23" fill="#17233c" text-anchor="middle" font-weight="600">Method A</text><rect x="385" y="147" width="110" height="148" fill="#7656a6"/><text x="440" y="132" font-size="28" fill="#7656a6" text-anchor="middle" font-weight="700">80</text><text x="440" y="334" font-size="23" fill="#17233c" text-anchor="middle" font-weight="600">Method B</text><text x="360" y="374" font-size="20" fill="#667085" text-anchor="middle" font-weight="400">Score · zero-based 0–100 axis</text></svg>
