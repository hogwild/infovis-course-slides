<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 296" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">The first four actual Citi Bike records, showing five original fields</title>
<desc id="desc">Selected source columns from the instructor CSV, in original row order. All values are exact. Each starttime is shown on two lines without changing its four fractional-second digits. Tripduration is measured in seconds.</desc>
