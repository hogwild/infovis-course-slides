<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG practice · one calendar cell</title>
  <style>
    body { margin: 32px; font: 24px/1.4 Arial, sans-serif; color: #263248; }
    svg { border: 1px solid #d8dbe4; }
    svg text { fill: white; font-size: 24px; font-family: Arial, sans-serif; }
  </style>
</head>
<body>
  <h1>One calendar cell</h1>
  <p>April 4, 2020 · 538 trips · Jersey City</p>
  <svg width="360" height="270" viewBox="0 0 240 180"
       role="img" aria-label="April 4 calendar cell: 538 trips">
    <g transform="translate(60,40)">
      <rect width="100" height="80"
        fill="#3157a4" stroke="#b86f16"
        stroke-width="3" />
      <text x="10" y="25">4</text>
      <text x="10" y="60">538</text>
    </g>
  </svg>
  <p>In this file, change <code>translate(60,40)</code> to
     <code>translate(100,60)</code>. Save and reload.</p>
  <p>Check: the shape and both labels move together.</p>
  <p>Data: <a href="https://citibikenyc.com/system-data">Citi Bike System Data</a>.</p>
</body>
</html>
