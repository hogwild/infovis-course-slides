<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img"><title>2015 global mammal carbon biomass: wild mammals 4%, humans 34%, livestock 62%.</title><g font-family="Arial, sans-serif"><text x="24.00" y="40.00" font-size="35" fill="#263248" text-anchor="start" font-weight="700">Humans and livestock account for 96%</text><text x="24.00" y="79.00" font-size="27" fill="#667085" text-anchor="start" font-weight="400">of global mammal carbon biomass in this 2015 estimate.</text><text x="24.00" y="130.00" font-size="27" fill="#263248" text-anchor="start" font-weight="400">Biomass here means the mass of carbon in living mammals.</text><text x="24.00" y="166.00" font-size="27" fill="#263248" text-anchor="start" font-weight="400">The percentages describe mass, not the number of animals.</text><line x1="250.00" y1="236.00" x2="250.00" y2="494.00" stroke="#d8dbe4" stroke-width="1.5"/><text x="250.00" y="536.00" font-size="27" fill="#667085" text-anchor="middle" font-weight="400">0</text><line x1="385.00" y1="236.00" x2="385.00" y2="494.00" stroke="#d8dbe4" stroke-width="1.5"/><text x="385.00" y="536.00" font-size="27" fill="#667085" text-anchor="middle" font-weight="400">20</text><line x1="520.00" y1="236.00" x2="520.00" y2="494.00" stroke="#d8dbe4" stroke-width="1.5"/><text x="520.00" y="536.00" font-size="27" fill="#667085" text-anchor="middle" font-weight="400">40</text><line x1="655.00" y1="236.00" x2="655.00" y2="494.00" stroke="#d8dbe4" stroke-width="1.5"/><text x="655.00" y="536.00" font-size="27" fill="#667085" text-anchor="middle" font-weight="400">60</text><line x1="790.00" y1="236.00" x2="790.00" y2="494.00" stroke="#d8dbe4" stroke-width="1.5"/><text x="790.00" y="536.00" font-size="27" fill="#667085" text-anchor="middle" font-weight="400">80</text><line x1="925.00" y1="236.00" x2="925.00" y2="494.00" stroke="#d8dbe4" stroke-width="1.5"/><text x="925.00" y="536.00" font-size="27" fill="#667085" text-anchor="middle" font-weight="400">100</text><text x="230.00" y="284.00" font-size="28" fill="#263248" text-anchor="end" font-weight="400">Wild mammals</text><rect data-category="Wild mammals" data-value="4" x="250" y="250" width="27.00" height="48" fill="#3157a4"/><text x="289.00" y="284.00" font-size="29" fill="#3157a4" text-anchor="start" font-weight="700">4%</text><text x="230.00" y="372.00" font-size="28" fill="#263248" text-anchor="end" font-weight="400">Humans</text><rect data-category="Humans" data-value="34" x="250" y="338" width="229.50" height="48" fill="#3157a4"/><text x="491.50" y="372.00" font-size="29" fill="#3157a4" text-anchor="start" font-weight="700">34%</text><text x="230.00" y="460.00" font-size="28" fill="#263248" text-anchor="end" font-weight="400">Livestock</text><rect data-category="Livestock" data-value="62" x="250" y="426" width="418.50" height="48" fill="#3157a4"/><text x="680.50" y="460.00" font-size="29" fill="#3157a4" text-anchor="start" font-weight="700">62%</text><text x="587.50" y="579.00" font-size="27" fill="#667085" text-anchor="middle" font-weight="400">Share of total mammal biomass (%)</text></g></svg>