<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img"><title>Car/van commute shares: scaling an icon in two dimensions squares the value ratio.</title><g font-family="Arial, sans-serif"><text x="15" y="32" font-size="28" fill="#263248" text-anchor="start" font-weight="700">Scale width and height with the value</text><text x="620" y="32" font-size="28" fill="#263248" text-anchor="start" font-weight="700">Fixed symbol + proportional length</text><g transform="translate(35 220) scale(0.85)" stroke="#c9455a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 47V34L21 30L33 12H65L78 30L92 34V47H82M60 47H39M18 47H8M26 30H73"/><circle cx="28" cy="48" r="10"/><circle cx="71" cy="48" r="10"/></g><g transform="translate(260 107) scale(2.4449693305551587)" stroke="#c9455a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 47V34L21 30L33 12H65L78 30L92 34V47H82M60 47H39M18 47H8M26 30H73"/><circle cx="28" cy="48" r="10"/><circle cx="71" cy="48" r="10"/></g><text x="80" y="310" font-size="25" fill="#263248" text-anchor="middle" font-weight="400">New York</text><text x="380" y="310" font-size="25" fill="#263248" text-anchor="middle" font-weight="400">Los Angeles</text><text x="80" y="347" font-size="27" fill="#263248" text-anchor="middle" font-weight="700">29.5%</text><text x="380" y="347" font-size="27" fill="#263248" text-anchor="middle" font-weight="700">84.8%</text><g transform="translate(620 132) scale(0.5)" stroke="#c9455a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 47V34L21 30L33 12H65L78 30L92 34V47H82M60 47H39M18 47H8M26 30H73"/><circle cx="28" cy="48" r="10"/><circle cx="71" cy="48" r="10"/></g><text x="685" y="123" font-size="25" fill="#263248" text-anchor="start" font-weight="400">New York</text><rect x="685" y="135" width="106.17429492714533" height="30" fill="#c9455a" stroke="none" stroke-width="1"/><text x="1075" y="161" font-size="25" fill="#263248" text-anchor="start" font-weight="400">29.5%</text><g transform="translate(620 242) scale(0.5)" stroke="#c9455a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 47V34L21 30L33 12H65L78 30L92 34V47H82M60 47H39M18 47H8M26 30H73"/><circle cx="28" cy="48" r="10"/><circle cx="71" cy="48" r="10"/></g><text x="685" y="233" font-size="25" fill="#263248" text-anchor="start" font-weight="400">Los Angeles</text><rect x="685" y="245" width="305.4034056355159" height="30" fill="#c9455a" stroke="none" stroke-width="1"/><text x="1075" y="271" font-size="25" fill="#263248" text-anchor="start" font-weight="400">84.8%</text><line x1="685" y1="120" x2="685" y2="295" stroke="#263248" stroke-width="1.5" stroke-dasharray=""/><line x1="685" y1="295" x2="1045" y2="295" stroke="#d8dbe4" stroke-width="1.5" stroke-dasharray=""/><text x="685" y="328" font-size="23" fill="#263248" text-anchor="start" font-weight="400">0</text><text x="1045" y="328" font-size="23" fill="#263248" text-anchor="end" font-weight="400">100%</text><text x="15" y="410" font-size="25" fill="#c9455a" text-anchor="start" font-weight="400">Value ratio: 2.88×  →  visible area ratio: 8.27×</text><text x="620" y="410" font-size="25" fill="#258276" text-anchor="start" font-weight="400">A shared zero baseline preserves the ratio.</text></g></svg>
