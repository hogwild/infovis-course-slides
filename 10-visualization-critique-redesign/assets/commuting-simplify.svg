<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 415" role="img"><title>Detailed car, simplified car and abstract bar shown large and at label size.</title><g font-family="Arial, sans-serif"><text x="30" y="34" font-size="28" fill="#263248" text-anchor="start" font-weight="700">Detailed vehicle</text><g transform="translate(88 100) scale(2.1)" stroke="#c9455a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 47V34L21 30L33 12H65L78 30L92 34V47H82M60 47H39M18 47H8M26 30H73"/><circle cx="28" cy="48" r="10"/><circle cx="71" cy="48" r="10"/><path d="M48 13V29M12 36H21M80 37H89M39 35H45M34 19H43M52 19H62M6 22H20M83 20H93"/></g><text x="30" y="300" font-size="24" fill="#667085" text-anchor="start" font-weight="400">Extra detail competes for space.</text><g transform="translate(130 345) scale(0.48)" stroke="#c9455a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 47V34L21 30L33 12H65L78 30L92 34V47H82M60 47H39M18 47H8M26 30H73"/><circle cx="28" cy="48" r="10"/><circle cx="71" cy="48" r="10"/><path d="M48 13V29M12 36H21M80 37H89M39 35H45M34 19H43M52 19H62M6 22H20M83 20H93"/></g><text x="194" y="375" font-size="24" fill="#263248" text-anchor="start" font-weight="400">Car/van</text><text x="420" y="34" font-size="28" fill="#263248" text-anchor="start" font-weight="700">Simplified silhouette</text><g transform="translate(478 100) scale(2.1)" stroke="#c9455a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 47V34L21 30L33 12H65L78 30L92 34V47H82M60 47H39M18 47H8M26 30H73"/><circle cx="28" cy="48" r="10"/><circle cx="71" cy="48" r="10"/></g><text x="420" y="300" font-size="24" fill="#667085" text-anchor="start" font-weight="400">Wheels + outline retain the cue.</text><g transform="translate(520 345) scale(0.48)" stroke="#c9455a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 47V34L21 30L33 12H65L78 30L92 34V47H82M60 47H39M18 47H8M26 30H73"/><circle cx="28" cy="48" r="10"/><circle cx="71" cy="48" r="10"/></g><text x="584" y="375" font-size="24" fill="#263248" text-anchor="start" font-weight="400">Car/van</text><text x="810" y="34" font-size="28" fill="#263248" text-anchor="start" font-weight="700">Abstract mark</text><rect x="870" y="153" width="210" height="44" fill="#c9455a" stroke="none" stroke-width="1"/><text x="810" y="300" font-size="24" fill="#667085" text-anchor="start" font-weight="400">Meaning relies on the label.</text><rect x="910" y="360" width="48" height="10" fill="#c9455a" stroke="none" stroke-width="1"/><text x="974" y="375" font-size="24" fill="#263248" text-anchor="start" font-weight="400">Car/van</text></g></svg>
