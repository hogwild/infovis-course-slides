<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img"><title>A city glyph combines five commute mode shares and mean one-way time on separate labelled scales.</title><g font-family="Arial, sans-serif"><g data-city="New York" data-share-domain="0 100" data-minute-domain="0 60"><text x="25" y="34" font-size="29" fill="#263248" text-anchor="start" font-weight="700">New York</text><g transform="translate(25 58) scale(0.31)" stroke="#c9455a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 47V34L21 30L33 12H65L78 30L92 34V47H82M60 47H39M18 47H8M26 30H73"/><circle cx="28" cy="48" r="10"/><circle cx="71" cy="48" r="10"/></g><text x="63" y="76" font-size="23" fill="#263248" text-anchor="start" font-weight="400">Car/van</text><rect x="157" y="59" width="82.58000716555748" height="19" fill="#c9455a" stroke="none" stroke-width="1"/><text x="525" y="77" font-size="25" fill="#263248" text-anchor="end" font-weight="400">29.5%</text><g transform="translate(25 87) scale(0.31)" stroke="#3157a4" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="5" width="66" height="51" rx="9"/><path d="M23 15H77V34H23ZM50 15V34M27 56V64M73 56V64"/><circle cx="30" cy="45" r="3"/><circle cx="70" cy="45" r="3"/></g><text x="63" y="105" font-size="23" fill="#263248" text-anchor="start" font-weight="400">Transit</text><rect x="157" y="88" width="154.5860787270625" height="19" fill="#3157a4" stroke="none" stroke-width="1"/><text x="525" y="106" font-size="25" fill="#263248" text-anchor="end" font-weight="400">55.2%</text><g transform="translate(25 116) scale(0.31)" stroke="#258276" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="52" cy="9" r="6"/><path d="M48 23L38 40L25 45M48 23L58 34L73 34M48 23L51 43L70 61M51 43L34 62"/></g><text x="63" y="134" font-size="23" fill="#263248" text-anchor="start" font-weight="400">Walk</text><rect x="157" y="117" width="30.601645523239572" height="19" fill="#258276" stroke="none" stroke-width="1"/><text x="525" y="135" font-size="25" fill="#263248" text-anchor="end" font-weight="400">10.9%</text><g transform="translate(25 145) scale(0.31)" stroke="#7656a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="23" cy="47" r="17"/><circle cx="78" cy="47" r="17"/><path d="M23 47L39 23L56 47H23M39 23H67L78 47M56 47L67 17H58M33 16H46M39 16V23"/></g><text x="63" y="163" font-size="23" fill="#263248" text-anchor="start" font-weight="400">Bike</text><rect x="157" y="146" width="5.07604839828886" height="19" fill="#7656a6" stroke="none" stroke-width="1"/><text x="525" y="164" font-size="25" fill="#263248" text-anchor="end" font-weight="400">1.8%</text><g transform="translate(25 174) scale(0.31)" stroke="#667085" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="34" r="4"/><circle cx="50" cy="34" r="4"/><circle cx="74" cy="34" r="4"/></g><text x="63" y="192" font-size="23" fill="#263248" text-anchor="start" font-weight="400">Other</text><rect x="157" y="175" width="7.1562201858515655" height="19" fill="#667085" stroke="none" stroke-width="1"/><text x="525" y="193" font-size="25" fill="#263248" text-anchor="end" font-weight="400">2.6%</text><line x1="157" y1="51" x2="157" y2="194" stroke="#263248" stroke-width="1.5" stroke-dasharray=""/><text x="157" y="212" font-size="19" fill="#667085" text-anchor="start" font-weight="400">0</text><text x="437" y="212" font-size="19" fill="#667085" text-anchor="end" font-weight="400">100%</text><text x="25" y="246" font-size="22" fill="#263248" text-anchor="start" font-weight="400">Mean trip</text><line x1="157" y1="239" x2="437" y2="239" stroke="#263248" stroke-width="2" stroke-dasharray=""/><line x1="157.0" y1="234" x2="157.0" y2="244" stroke="#263248" stroke-width="1.5" stroke-dasharray=""/><text x="157.0" y="266" font-size="19" fill="#667085" text-anchor="middle" font-weight="400">0</text><line x1="297.0" y1="234" x2="297.0" y2="244" stroke="#263248" stroke-width="1.5" stroke-dasharray=""/><text x="297.0" y="266" font-size="19" fill="#667085" text-anchor="middle" font-weight="400">30</text><line x1="437.0" y1="234" x2="437.0" y2="244" stroke="#263248" stroke-width="1.5" stroke-dasharray=""/><text x="437.0" y="266" font-size="19" fill="#667085" text-anchor="middle" font-weight="400">60</text><circle cx="344.2107322320983" cy="239" r="7" fill="#263248"/><text x="560" y="246" font-size="23" fill="#263248" text-anchor="end" font-weight="700">40.1 min</text></g><text x="25" y="338" font-size="28" fill="#263248" text-anchor="start" font-weight="700">Five lengths → shares of commute modes</text><text x="25" y="380" font-size="27" fill="#263248" text-anchor="start" font-weight="700">One position → mean one-way commute time</text><text x="25" y="428" font-size="27" fill="#263248" text-anchor="start" font-weight="400">Fixed icons and colors → mode identity</text><text x="25" y="474" font-size="27" fill="#263248" text-anchor="start" font-weight="400">One repeated visual unit → one city</text></g></svg>
