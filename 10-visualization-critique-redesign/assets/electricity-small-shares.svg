<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 506" role="img"><title>Norway small-source shares: oil gets one unit, solar and bioenergy get zero; all retain nonzero numeric labels.</title><g font-family="Arial, sans-serif"><text x="20" y="32" font-size="29" fill="#263248" text-anchor="start" font-weight="700">Norway · one whole symbol ≈ 1%</text><text x="660" y="32" font-size="29" fill="#263248" text-anchor="start" font-weight="700">Small-source detail · Norway</text><g transform="translate(20 90) scale(0.6833333333333333)" fill="none" stroke="#8c564b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="30" cy="10" rx="19" ry="6"/><path d="M11 10V47C11 55 49 55 49 47V10M11 25H49M11 38H49"/></g><text x="79" y="120" font-size="26" fill="#263248" text-anchor="start" font-weight="400">Oil</text><text x="340" y="120" font-size="26" fill="#263248" text-anchor="end" font-weight="400">1 symbol</text><text x="555" y="120" font-size="28" fill="#263248" text-anchor="end" font-weight="700">0.46%</text><text x="660" y="120" font-size="25" fill="#263248" text-anchor="start" font-weight="400">Oil</text><rect x="800" y="100" width="119.15218636624022" height="27" fill="#8c564b"/><text x="1140" y="122" font-size="25" fill="#263248" text-anchor="end" font-weight="400">0.46%</text><g transform="translate(20 183) scale(0.6833333333333333)" fill="none" stroke="#c9455a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 24H47L55 50H3ZM18 24L14 50M34 24L38 50M5 37H51M25 50V57M16 57H36"/><circle cx="47" cy="9" r="6"/><path d="M47 0V1M58 9H59M38 9H37"/></g><text x="79" y="213" font-size="26" fill="#263248" text-anchor="start" font-weight="400">Solar</text><text x="340" y="213" font-size="26" fill="#263248" text-anchor="end" font-weight="400">0 symbols</text><text x="555" y="213" font-size="28" fill="#263248" text-anchor="end" font-weight="700">0.34%</text><text x="660" y="213" font-size="25" fill="#263248" text-anchor="start"