<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 500" role="img"><title>Four simplified transport pictograms; mixed Other remains a labelled category.</title><g font-family="Arial, sans-serif"><g transform="translate(85 20) scale(1.25)" stroke="#c9455a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 47V34L21 30L33 12H65L78 30L92 34V47H82M60 47H39M18 47H8M26 30H73"/><circle cx="28" cy="48" r="10"/><circle cx="71" cy="48" r="10"/></g><text x="148" y="145" font-size="28" fill="#263248" text-anchor="middle" font-weight="700">Car/van</text><g transform="translate(440 20) scale(1.25)" stroke="#3157a4" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="5" width="66" height="51" rx="9"/><path d="M23 15H77V34H23ZM50 15V34M27 56V64M73 56V64"/><circle cx="30" cy="45" r="3"/><circle cx="70" cy="45" r="3"/></g><text x="503" y="145" font-size="28" fill="#263248" text-anchor="middle" font-weight="700">Transit</text><g transform="translate(85 200) scale(1.25)" stroke="#258276" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="52" cy="9" r="6"/><path d="M48 23L38 40L25 45M48 23L58 34L73 34M48 23L51 43L70 61M51 43L34 62"/></g><text x="148" y="325" font-size="28" fill="#263248" text-anchor="middle" font-weight="700">Walk</text><g transform="translate(440 200) scale(1.25)" stroke="#7656a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="23" cy="47" r="17"/><circle cx="78" cy="47" r="17"/><path d="M23 47L39 23L56 47H23M39 23H67L78 47M56 47L67 17H58M33 16H46M39 16V23"/></g><text x="503" y="325" font-size="28" fill="#263248" text-anchor="middle" font-weight="700">Bike</text><text x="20" y="432" font-size="25" fill="#667085" text-anchor="start" font-weight="400">“Other” includes taxi, motorcycle and other means.</text><text x="20" y="470" font-size="25" fill="#667085" text-anchor="start" font-weight="400">Keep this mixed category labelled in words.</text></g></svg>
