<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 540" role="img"><title>Four steps for making a treemap</title><g font-family="Arial,sans-serif"><g transform="translate(5 5)"><g transform="scale(.4)"><rect x="0" y="0" width="900" height="300" fill="#edf3fc"/><text x="450.0" y="150.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">15</text><rect width="900" height="300" fill="none" stroke="#17233c" stroke-width="3"/></g><text x="386" y="45" font-size="23" font-weight="700" fill="#17233c">1. Total = 15</text><text x="386" y="80" font-size="22" fill="#667085">One rectangle</text></g><g transform="translate(5 139)"><g transform="scale(.4)"><rect x="0" y="0" width="540" height="300" fill="#edf3fc"/><text x="270.0" y="150.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">9</text><rect x="540" y="0" width="360" height="300" fill="#f3effa"/><text x="720.0" y="150.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">6</text><rect width="900" height="300" fill="none" stroke="#17233c" stroke-width="3"/><path d="M540 0V300" stroke="#c9455a" stroke-width="4"/></g><text x="386" y="45" font-size="23" font-weight="700" fill="#17233c">2. Vertical split</text><text x="386" y="80" font-size="22" fill="#667085">9/15 and 6/15</text></g><g transform="translate(5 273)"><g transform="scale(.4)"><rect x="0" y="0" width="540" height="300" fill="#edf3fc"/><text x="270.0" y="150.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">9</text><rect x="540" y="0" width="360" height="50" fill="#f3effa"/><text x="720.0" y="25.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">1</text><rect x="540" y="50" width="360" height="100" fill="#e1d5ef"/><text x="720.0" y="100.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">2</text><rect x="540" y="150" width="360" height="150" fill="#c6addf"/><text x="720.0" y="225.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">3</text><rect width="900" height="300" fill="none" stroke="#17233c" stroke-width="3"/><path d="M540 0V300" stroke="#17233c" stroke-width="4"/><path d="M540 50H900M540 150H900" stroke="#c9455a" stroke-width="4"/></g><text x="386" y="45" font-size="23" font-weight="700" fill="#17233c">3. Split 6 horizontally</text><text x="386" y="80" font-size="22" fill="#667085">1 + 2 + 3</text></g><g transform="translate(5 407)"><g transform="scale(.4)"><rect x="0" y="0" width="540" height="100" fill="#edf3fc"/><text x="270.0" y="50.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">3</text><rect x="0" y="100" width="540" height="100" fill="#dce6fa"/><text x="270.0" y="150.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">3</text><rect x="0" y="200" width="540" height="100" fill="#b8ccef"/><text x="270.0" y="250.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">3</text><rect x="540" y="0" width="360" height="50" fill="#f3effa"/><text x="720.0" y="25.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">1</text><rect x="540" y="50" width="360" height="100" fill="#e1d5ef"/><text x="720.0" y="100.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">2</text><rect x="540" y="150" width="360" height="150" fill="#c6addf"/><text x="720.0" y="225.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="45">3</text><rect width="900" height="300" fill="none" stroke="#17233c" stroke-width="3"/><path d="M540 0V300" stroke="#17233c" stroke-width="4"/><path d="M540 50H900M540 150H900" stroke="#17233c" stroke-width="4"/><path d="M0 100H540M0 200H540" stroke="#c9455a" stroke-width="4"/></g><text x="386" y="45" font-size="23" font-weight="700" fill="#17233c">4. Split 9 horizontally</text><text x="386" y="80" font-size="22" fill="#667085">3 + 3 + 3</text></g></g></svg>