<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img"><title>Split the 9-unit region horizontally</title><g font-family="Arial,sans-serif"><g transform="translate(30 25)"><rect x="0" y="0" width="540" height="100" fill="#edf3fc"/><text x="270.0" y="50.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="40">3</text><rect x="0" y="100" width="540" height="100" fill="#dce6fa"/><text x="270.0" y="150.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="40">3</text><rect x="0" y="200" width="540" height="100" fill="#b8ccef"/><text x="270.0" y="250.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="40">3</text><rect x="540" y="0" width="360" height="50" fill="#f3effa"/><text x="720.0" y="25.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="40">1</text><rect x="540" y="50" width="360" height="100" fill="#e1d5ef"/><text x="720.0" y="100.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="40">2</text><rect x="540" y="150" width="360" height="150" fill="#c6addf"/><text x="720.0" y="225.0" text-anchor="middle" dominant-baseline="central" fill="#17233c" font-size="40">3</text><rect width="900" height="300" fill="none" stroke="#17233c" stroke-width="3"/><path d="M540 0V300" stroke="#17233c" stroke-width="4"/><path d="M540 50H900M540 150H900" stroke="#17233c" stroke-width="4"/><path d="M0 100H540M0 200H540" stroke="#c9455a" stroke-width="4"/></g><text x="480" y="380" text-anchor="middle" font-size="32" fill="#263248">Within 9: three equal parts of 3/9 each.</text></g></svg>