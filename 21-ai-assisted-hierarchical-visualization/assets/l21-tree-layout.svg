<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 340" role="img" aria-labelledby="tree-title tree-desc">
<title id="tree-title">Titanic passengers grouped by sex and passenger class</title>
<desc id="tree-desc">A top-down node-link tree with nine nodes and eight links. Passengers contains male and female. Each sex branch contains three class groups. Circle size does not encode passenger counts.</desc>
<g transform="translate(30,40)" font-family="Inter, Arial, sans-serif" font-size="26" fill="#17233c">
<path d="M550,0C550,65,275,65,275,130" fill="none" stroke="#9aa7ba" stroke-width="2"/>
<path d="M550,0C550,65,825,65,825,130" fill="none" stroke="#9aa7ba" stroke-width="2"/>
<path d="M275,130C275,195,137.5,195,137.5,260" fill="none" stroke="#9aa7ba" stroke-width="2"/>
<path d="M275,130C275,195,275,195,275,260" fill="none" stroke="#9aa7ba" stroke-width="2"/>
<path d="M275,130C275,195,412.5,195,412.5,260" fill="none" stroke="#9aa7ba" stroke-width="2"/>
<path d="M825,130C825,195,687.5,195,687.5,260" fill="none" stroke="#9aa7ba" stroke-width="2"/>
<path d="M825,130C825,195,825,195,825,260" fill="none" stroke="#9aa7ba" stroke-width="2"/>
<path d="M825,130C825,195,962.5,195,962.5,260" fill="none" stroke="#9aa7ba" stroke-width="2"/>
<g class="node" transform="translate(550,0)"><circle r="5" fill="#3157a4"/><text x="9" dy="0.32em">Passengers</text></g>
<g class="node" transform="translate(275,130)"><circle r="5" fill="#3157a4"/><text x="9" dy="0.32em">male</text></g>
<g class="node" transform="translate(825,130)"><circle r="5" fill="#3157a4"/><text x="9" dy="0.32em">female</text></g>
<g class="node" transform="translate(137.5,260)"><circle r="5" fill="#3157a4"/><text x="9" dy="0.32em">Class 3</text></g>
<g class="node" transform="translate(275,260)"><circle r="5" fill="#3157a4"/><text x="9" dy="0.32em">Class 1</text></g>
<g class="node" transform="translate(412.5,260)"><circle r="5" fill="#3157a4"/><text x="9" dy="0.32em">Class 2</text></g>
<g class="node" transform="translate(687.5,260)"><circle r="5" fill="#3157a4"/><text x="9" dy="0.32em">Class 1</text></g>
<g class="node" transform="translate(825,260)"><circle r="5" fill="#3157a4"/><text x="9" dy="0.32em">Class 3</text></g>
