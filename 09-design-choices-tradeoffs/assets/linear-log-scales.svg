<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img"><title>Scale geometry only. Equal intervals mean equal differences on linear scales, equal ratios on logarithmic scales.</title><g font-family="Arial, sans-serif"><text x="20.0" y="38.0" font-size="31" fill="#3157a4" text-anchor="start" font-weight="700">Linear</text><line x1="55.0" y1="330.0" x2="465.0" y2="330.0" stroke="#263248" stroke-width="2" stroke-dasharray=""/><line x1="55.0" y1="320.0" x2="55.0" y2="345.0" stroke="#263248" stroke-width="2" stroke-dasharray=""/><text x="55.0" y="302.0" font-size="24" fill="#263248" text-anchor="middle" font-weight="400">10</text><line x1="92.3" y1="320.0" x2="92.3" y2="345.0" stroke="#263248" stroke-width="2" stroke-dasharray=""/><text x="92.3" y="385.0" font-size="24" fill="#263248" text-anchor="middle" font-weight="400">100</text><line x1="465.0" y1="320.0" x2="465.0" y2="345.0" stroke="#263248" stroke-width="2" stroke-dasharray=""/><text x="465.0" y="385.0" font-size="24" fill="#263248" text-anchor="middle" font-weight="400">1000</text><text x="20.0" y="100.0" font-size="25" fill="#263248" text-anchor="start" font-weight="400">Equal distance = equal difference</text><text x="20.0" y="155.0" font-size="26" fill="#263248" text-anchor="start" font-weight="400">10 → 100: +90</text><text x="20.0" y="201.0" font-size="26" fill="#263248" text-anchor="start" font-weight="400">100 → 1,000: +900</text><text x="590.0" y="38.0" font-size="31" fill="#3157a4" text-anchor="start" font-weight="700">Logarithmic</text><line x1="625.0" y1="330.0" x2="1035.0" y2="330.0" stroke="#263248" stroke-width="2" stroke-dasharray=""/><line x1="625.0" y1="320.0" x2="625.0" y2="345.0" stroke="#263248" stroke-width="2" stroke-dasharray=""/><text x="625.0" y="385.0" font-size="24" fill="#263248" text-anchor="middle" font-weight="400">10</text><line x1="830.0" y1="320.0" x2="830.0" y2="345.0" stroke="#263248" stroke-width="2" stroke-dasharray=""/><text x="830.0" y="385.0" font-size="24" fill="#263248" text-anchor="middle" font-weight="400">100</text><line x1="1035.0" y1="320.0" x2="1035.0" y2="345.0" stroke="#263248" stroke-width="2" stroke-dasharray=""/><text x="1035.0" y="385.0" font-size="24" fill="#263248" text-anchor="middle" font-weight="400">1000</text><text x="590.0" y="100.0" font-size="25" fill="#263248" text-anchor="start" font-weight="400">Equal distance = equal ratio</text><text x="590.0" y="155.0" font-size="26" fill="#263248" text-anchor="start" font-weight="400">10 → 100: ×10</text><text x="590.0" y="201.0" font-size="26" fill="#263248" text-anchor="start" font-weight="400">100 → 1,000: ×10</text></g></svg>