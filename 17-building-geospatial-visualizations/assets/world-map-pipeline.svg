<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="340" viewBox="0 0 1136 340" role="img" aria-label="An array of country features supplies geographic coordinates. A projection converts longitude and latitude to drawing coordinates; geoPath generates SVG path commands. D3 creates one SVG path for each feature, illustrated with Indonesia.">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c9455a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#263248}.heading{font-size:23px;font-weight:bold;fill:#17233c}.code{font-family:monospace;font-size:19px}.note{font-size:18px;fill:#667085}.accent{fill:#3157a4}.arrow{stroke:#c9455a;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<text class="heading" x="8" y="27">1. Array of country features</text>
<text class="code accent" x="8" y="60">world.features</text>
<text class="code" x="8" y="91">[</text>
<text class="code" x="28" y="119">{ ... },</text>
<rect x="24" y="132" width="282" height="119" rx="3" fill="#edf3fc" stroke="#3157a4"/>
<text x="38" y="159" font-size="21" font-weight="bold">Indonesia</text>
<text class="code" x="38" y="187">geometry.coordinates:</text>
<text class="code" x="38" y="214">[141.0, -2.6], ...</text>
<text class="note" x="38" y="238">longitude, latitude (degrees)</text>
<text class="code" x="28" y="279">{ ... }, ...</text><text class="code" x="8" y="307">]</text>
<path class="arrow" d="M315,193 H350 V112 H378"/>
<text class="heading" x="382" y="27">2. Convert the coordinates</text>
<rect x="389" y="79" width="286" height="66" fill="#f3effa" stroke="#7656a6"/>
<text x="532" y="107" text-anchor="middle" font-size="22" font-weight="bold">Projection</text>
<text x="532" y="133" text-anchor="middle" class="code">geoEqualEarth()</text>
<path class="arrow" d="M532,149 V174"/>
<text class="code" x="532" y="201" text-anchor="middle">[x, y] = [285.0, 76.4]</text>
<path class="arrow" d="M532,212 V236"/>
<rect x="389" y="247" width="286" height="53" fill="#f3effa" stroke="#7656a6"/>
<text class="code" x="532" y="280" text-anchor="middle">geoPath(projection)</text>
<path class="arrow" d="M685,274 H725 V193 H766"/>
<text class="heading" x="787" y="27">3. SVG draws the outline</text>
<text class="code" x="787" y="67">&lt;path d="M…L…Z" /&gt;</text>
<rect x="787" y="88" width="337" height="184" fill="#ffffff" stroke="#d8dbe4"/>
