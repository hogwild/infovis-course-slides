<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="305" viewBox="0 0 1136 305"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#3157a4"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17233c}.title{font-size:22px;font-weight:bold}.code{font-family:monospace;font-size:19px}.note{font-size:19px;fill:#667085}.arrow{stroke:#3157a4;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect x="1" y="12" width="273" height="156" fill="#edf3fc" stroke="#b8cce5"/><text class="title" x="12" y="44">1. Select a container</text><text class="code" x="12" y="79">d3.select(&quot;#chart&quot;)</text><text class="code" x="12" y="109">.append(&quot;svg&quot;)</text><text class="note" x="12" y="146">Choose where to draw.</text><path class="arrow" d="M275 90 H285"/><rect x="288" y="12" width="273" height="156" fill="#edf3fc" stroke="#b8cce5"/><text class="title" x="299" y="44">2. Bind data</text><text class="code" x="299" y="79">.selectAll(&quot;rect&quot;)</text><text class="code" x="299" y="109">.data(values)</text><text class="note" x="299" y="146">Match records to elements.</text><path class="arrow" d="M562 90 H572"/><rect x="575" y="12" width="273" height="156" fill="#edf3fc" stroke="#b8cce5"/><text class="title" x="586" y="44">3. Create marks</text><text class="code" x="586" y="79">.enter()</text><text class="code" x="586" y="109">.append(&quot;rect&quot;)</text><text class="note" x="586" y="146">Create missing rectangles.</text><path class="arrow" d="M849 90 H859"/><rect x="862" y="12" width="273" height="156" fill="#edf3fc" stroke="#b8cce5"/><text class="title" x="873" y="44">4. Set channels</text><text class="code" x="873" y="75">.attr("width",</text><text class="code" x="873" y="99">  d =&gt; x(d))</text><text class="code" x="873" y="123">.attr("fill", "blue")</text><text class="note" x="873" y="146">Set size, position, color…</text><path class="arrow" d="M995 233 V174"/><rect x="1" y="231" width="1134" height="69" fill="#f3effa" stroke="#c5b7da"/><text x="18" y="259" class="title">D3 helpers</text><text x="180" y="259" class="code">scale: data → channel values</text><text x="180" y="286" class="code">axis: draw ticks and labels from a scale</text><text x="800" y="276" class="note">.call(d3.axisBottom(x))</text></svg>