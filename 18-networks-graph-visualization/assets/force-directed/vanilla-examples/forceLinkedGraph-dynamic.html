<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citi Bike node-link diagram · Dynamic · D3 v7</title>
  <link rel="stylesheet" href="vendor/codemirror-5.65.20/codemirror.css">
  <link rel="stylesheet" href="teaching.css">
</head>
<body>
  <main class="teaching-layout">
    <section class="chart-pane draggable" aria-label="Visualization">
      <!-- The viewBox places (0, 0) at the center of the drawing area. -->
      <svg viewBox="-300 -320 600 640" role="img" aria-label="Citi Bike station network"></svg>
    </section>
    <section class="code-pane" aria-label="JavaScript editor">
      <div id="code-editor"></div>
      <div id="code-status" role="status" aria-live="polite">Edit JavaScript to update the chart.</div>
    </section>
  </main>

  <script id="example-code" type="text/plain">
    // 1. Copy nodes and links: D3 changes positions and link endpoints.
    // April 2020 Citi Bike trip data; source and aggregation: README.md.
    const nodes = CITIBIKE_DATA.nodes.map(d => ({ ...d }));
    const links = CITIBIKE_DATA.links
      .filter(d => d.source !== d.target) // Omit same-station trips.
      .map(d => ({ ...d }));
    const svg = d3.select('svg');

    // 2. Node radius represents arrivals; line width represents trip count.
    const radius = d3.scaleLinear()
      .domain(d3.extent(nodes, d => d.arrivals))
      .range([5, 20]);

    // 3. Draw links first so nodes appear on top of them.
    const lines = svg.append('g').selectAll('line')
      .data(links)
      .join('line')
      .attr('stroke', '#999')
      .attr('stroke-opacity', 0.25)
      .attr('stroke-width', d => Math.sqrt(d.value));

    // Use the station ID's second digit for color, matching the bubble graph.
    // These colors distinguish IDs; they do not represent geographic groups.
    const circles = svg.append('g').selectAll('circle')
      .data(nodes)
      .join('circle')
      .attr('r', d => radius(d.arrivals))
      .attr('fill', d => d3.schemeCategory10[Number(String(d.id)[1])])
      .attr('stroke', 'white');

    // 4. Link force resolves source/target IDs to node objects using id().
    // Links attract, charge repels, and center keeps the network in view.
    // The target distance is a layout parameter, not geographic distance.
    const simulation = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(70))
      .force('charge', d3.forceManyBody().strength(-80))
      .force('center', d3.forceCenter(0, 0));

    // 5. Read each endpoint's current coordinates on every simulation tick.
    simulation.on('tick', () => {
      lines
        .attr('x1', d => d.source.x)
        .attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x)
        .attr('y2', d => d.target.y);
      circles
        .attr('cx', d => d.x)
        .attr('cy', d => d.y);
    });

    // 6. Dragging pins a node; releasing it lets the forces move it again.
    circles.call(d3.drag()
      .on('start', (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      })
      .on('drag', (event, d) => {
        d.fx = event.x;
        d.fy = event.y;
      })
      .on('end', (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }));
  </script>
  <script src="vendor/codemirror-5.65.20/codemirror.js"></script>
  <script src="vendor/codemirror-5.65.20/javascript.js"></script>
  <script src="teaching-view.js"></script>
</body>
</html>
