<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" role="img" aria-labelledby="title desc">
<title id="title">SVG width and available bar width</title><desc id="desc">Total width 520, with left margin 100, bar area 320 and right margin 100. Bars start at x 100. The range gives lengths from zero to 320, not absolute x positions.</desc>
<g font-family="Arial, sans-serif" fill="#24233d" text-anchor="middle">
<text x="280" y="27" font-size="24" font-weight="bold">SVG total width: 520</text>
<path d="M20 43H540 M20 35V51 M540 35V51" fill="none" stroke="#24233d" stroke-width="2"/>
<rect x="20" y="74" width="100" height="112" fill="#f1edf8"/>
<rect x="120" y="74" width="320" height="112" fill="#e3f1f9"/>
<rect x="440" y="74" width="100" height="112" fill="#f1edf8"/>
<rect x="20" y="74" width="520" height="112" fill="none" stroke="#858599"/>
<path d="M120 65V197 M440 65V197" stroke="#365f9a" stroke-dasharray="5 4"/>
<g font-size="22"><text x="70" y="106">Left</text><text x="70" y="134">margin</text><text x="70" y="166" font-weight="bold">100</text>
<text x="280" y="106">Bar drawing area</text><text x="280" y="143" font-size="30" font-weight="bold">320</text>
<text x="490" y="106">Right</text><text x="490" y="134">margin</text><text x="490" y="166" font-weight="bold">100</text></g>
<g font-size="20"><text x="20" y="220">0</text><text x="120" y="220">100</text><text x="440" y="220">420</text><text x="540" y="220">520</text></g>
<text x="280" y="252" font-size="22">100 + 320 + 100 = 520</text>
<text x="280" y="291" font-size="24" font-weight="bold" fill="#365f9a">Bar lengths: range([0, 320])</text>
</g></svg>