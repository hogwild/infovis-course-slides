<!doctype html><html lang="en"><head><meta charset="utf-8"><title>DOM event example</title><style>body{margin:60px;font:28px Arial}button{font:inherit;padding:12px}</style></head><body><button id="show">Show total</button><p id="result">Click the button.</p><script>const button = document.querySelector("#show");button.addEventListener("click", () => {document.querySelector("#result").textContent = 667;});</script></body></html>
