<text x="38" y="297" font-size="30" font-weight="600">Obesity</text>
<text x="38" y="333" font-size="30" font-weight="600">level</text>
<text x="348.0" y="83" text-anchor="middle" font-size="28">Low</text>
<text x="504.0" y="83" text-anchor="middle" font-size="28">Medium</text>
<text x="660.0" y="83" text-anchor="middle" font-size="28">High</text>
<text x="242" y="196.0" text-anchor="end" font-size="28">High</text>
<text x="242" y="352.0" text-anchor="end" font-size="28">Medium</text>
<text x="242" y="508.0" text-anchor="end" font-size="28">Low</text>
<rect x="270" y="108" width="156" height="156" fill="#f3b300" stroke="#ffffff" stroke-width="3"/>
