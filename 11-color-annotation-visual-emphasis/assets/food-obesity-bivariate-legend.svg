<svg xmlns="http://www.w3.org/2000/svg" width="870" height="640" viewBox="0 0 870 640" role="img" aria-labelledby="title desc">
<title id="title">Food insecurity and obesity: the same nine classes as the preceding map</title>
<desc id="desc">Food insecurity increases from left to right. Obesity increases from bottom to top. Corner labels list food insecurity first and obesity second.</desc>
<g font-family="Arial, sans-serif" fill="#17233c">
