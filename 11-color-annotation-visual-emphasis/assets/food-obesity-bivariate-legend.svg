<rect x="426" y="264" width="156" height="156" fill="#b4b4b4" stroke="#ffffff" stroke-width="3"/>
<rect x="582" y="264" width="156" height="156" fill="#376287" stroke="#ffffff" stroke-width="3"/>
<rect x="270" y="420" width="156" height="156" fill="#f4f4f3" stroke="#ffffff" stroke-width="3"/>
<rect x="426" y="420" width="156" height="156" fill="#b3d3e2" stroke="#ffffff" stroke-width="3"/>
<rect x="582" y="420" width="156" height="156" fill="#509dc2" stroke="#ffffff" stroke-width="3"/>
<text x="348" y="195" text-anchor="middle" fill="#17233c" font-size="25" font-weight="600">Low × high</text>
<text x="660" y="195" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="600">High × high</text>
