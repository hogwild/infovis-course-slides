<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330"><g font-family="Arial, sans-serif" fill="#202430"><text x="0" y="30" font-size="30" font-weight="bold">U.S. Air Quality Index (AQI)</text><rect x="0" y="52" width="27" height="28" fill="#00e400"/><text x="150" text-anchor="end" y="75" font-size="27">0–50</text><text x="174" y="75" font-size="25">Good</text><rect x="0" y="97" width="27" height="28" fill="#ffff00"/><text x="150" text-anchor="end" y="120" font-size="27">51–100</text><text x="174" y="120" font-size="25">Moderate</text><rect x="0" y="142" width="27" height="28" fill="#ff7e00"/><text x="150" text-anchor="end" y="165" font-size="27">101–150</text><text x="174" y="165" font-size="25">Unhealthy for sensitive groups</text><rect x="0" y="187" width="27" height="28" fill="#ff0000"/><text x="150" text-anchor="end" y="210" font-size="27">151–200</text><text x="174" y="210" font-size="25">Unhealthy</text><rect x="0" y="232" width="27" height="28" fill="#8f3f97"/><text x="150" text-anchor="end" y="255" font-size="27">201–300</text><text x="174" y="255" font-size="25">Very unhealthy</text><rect x="0" y="277" width="27" height="28" fill="#7e0023"/><text x="150" text-anchor="end" y="300" font-size="27">301+</text><text x="174" y="300" font-size="25">Hazardous</text></g></svg>