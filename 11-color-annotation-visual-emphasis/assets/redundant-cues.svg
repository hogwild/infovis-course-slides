<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img"><rect width="760" height="440" fill="white"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="29" fill="#19233B" text-anchor="start" font-weight="700">Category identity</text><line x1="50" y1="120" x2="480" y2="120" stroke="#0072B2" stroke-width="6"/><text x="515" y="130" font-family="Arial,sans-serif" font-size="28" fill="#19233B" text-anchor="start" font-weight="400">Group A</text><line x1="50" y1="220" x2="480" y2="220" stroke="#D55E00" stroke-width="6" stroke-dasharray="18 10"/><text x="515" y="230" font-family="Arial,sans-serif" font-size="28" fill="#19233B" text-anchor="start" font-weight="400">Group B</text><text x="40" y="340" font-family="Arial,sans-serif" font-size="29" fill="#19233B" text-anchor="start" font-weight="700">Hue + line pattern + direct label</text><text x="40" y="390" font-family="Arial,sans-serif" font-size="25" fill="#637084" text-anchor="start" font-weight="400">A second cue preserves the category distinction.</text></svg>