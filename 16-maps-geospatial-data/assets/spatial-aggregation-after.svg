<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="title desc"><title id="title">Spatial aggregation: after</title><desc id="desc">The same regions after aggregating the twelve incidents: A has five, B four, and C three. Individual incident locations are omitted. Hypothetical teaching example.</desc><g font-family="Arial, Helvetica, sans-serif"><polygon points="20,20 220,20 205,100 245,160 200,240 20,240" fill="#edf3fc" stroke="#667085" stroke-width="2.2" stroke-linejoin="round"/><polygon points="220,20 460,20 460,125 345,110 290,140 245,160 205,100" fill="#f3effa" stroke="#667085" stroke-width="2.2" stroke-linejoin="round"/><polygon points="245,160 290,140 345,110 460,125 460,240 200,240" fill="#eaf6f1" stroke="#667085" stroke-width="2.2" stroke-linejoin="round"/><text x="43" y="46" fill="#3157a4" font-size="24" font-weight="700">A</text><text x="425" y="46" fill="#7656a6" font-size="24" font-weight="700">B</text><text x="425" y="224" fill="#258276" font-size="24" font-weight="700">C</text><text x="120" y="125" fill="#17233c" font-size="44" font-weight="700" text-anchor="middle">5</text><text x="120" y="151" fill="#263248" font-size="22" text-anchor="middle">incidents</text><text x="330" y="69" fill="#17233c" font-size="44" font-weight="700" text-anchor="middle">4</text><text x="330" y="95" fill="#263248" font-size="22" text-anchor="middle">incidents</text><text x="335" y="187" fill="#17233c" font-size="44" font-weight="700" text-anchor="middle">3</text><text x="335" y="213" fill="#263248" font-size="22" text-anchor="middle">incidents</text></g></svg>
